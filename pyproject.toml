[project]
name = "emerald"
version = "0.1.0"
description = "A veterinary phone line that acts, proves its claims, and asks a vet before anything irreversible."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "strands-agents[ollama,bidi]>=1.62.0",
  "mcp>=1.12",
  "boto3>=1.40",
  "pydantic>=2.8",
  "cryptography>=43",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=5", "fonttools>=4.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emerald"]

[tool.pytest.ini_options]
testpaths = ["tests"]
